<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Serentica Site Manpower Management System
</title>

<!-- Google Font -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<!-- Font Awesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:'Poppins',sans-serif;

}

:root{

--primary:#33A7B5;

--primary-dark:#248895;

--background:#F4F7F9;

--white:#FFFFFF;

--border:#E4EBEF;

--text:#27343C;

--text-light:#6F7C84;

--success:#2ECC71;

--warning:#F39C12;

--danger:#E74C3C;

--shadow:0 8px 25px rgba(0,0,0,.08);

--radius:18px;

}

body{

background:var(--background);

color:var(--text);

padding:30px;

}


/*====================================================

MAIN CONTAINER

====================================================*/

.container{

max-width:1500px;

margin:auto;

}


/*====================================================

HEADER

====================================================*/

.header{

background:var(--white);

border-radius:20px;

padding:22px 30px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:var(--shadow);

margin-bottom:25px;

}


/*====================================================

COMPANY

====================================================*/

.company{

display:flex;

align-items:center;

gap:20px;

}

.company img{

width:72px;

height:72px;

object-fit:contain;

}

.company h1{

font-size:28px;

font-weight:700;

color:var(--primary);

margin-bottom:5px;

}

.company p{

font-size:14px;

color:var(--text-light);

}


/*====================================================

PROFILE PANEL

====================================================*/

.profile{

display:flex;

align-items:center;

gap:18px;

}

.profile img{

width:72px;

height:72px;

border-radius:50%;

border:3px solid var(--primary);

object-fit:cover;

}

.profile-info{

text-align:right;

}

.profile-info h3{

font-size:19px;

margin-bottom:4px;

}

.profile-info p{

font-size:13px;

color:var(--text-light);

line-height:22px;

}

.logout-btn{

display:inline-flex;

align-items:center;

gap:8px;

margin-top:10px;

padding:10px 18px;

background:var(--primary);

color:white;

text-decoration:none;

border-radius:10px;

font-size:14px;

font-weight:600;

transition:.3s;

}

.logout-btn:hover{

background:var(--primary-dark);

}


/*====================================================

WELCOME PANEL

====================================================*/

.welcome-panel{

background:white;

border-radius:20px;

padding:30px;

box-shadow:var(--shadow);

margin-bottom:28px;

display:flex;

justify-content:space-between;

align-items:center;

}

.welcome-text h2{

font-size:34px;

margin-bottom:10px;

color:var(--primary);

}

.welcome-text p{

font-size:15px;

line-height:28px;

color:var(--text-light);

max-width:760px;

}


/*====================================================

LIVE DATE & TIME

====================================================*/

.datetime{

text-align:right;

}

.datetime h3{

font-size:16px;

margin-bottom:10px;

color:var(--primary);

}

.datetime p{

font-size:14px;

line-height:24px;

color:var(--text-light);

}
/*====================================================

EXECUTIVE OVERVIEW

====================================================*/

.section-title{

font-size:24px;

font-weight:600;

margin-bottom:20px;

color:var(--primary);

}

.executive-overview{

margin-bottom:35px;

}

.kpi-grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:35px;

}

.kpi-card{

background:var(--white);

border-radius:var(--radius);

padding:24px;

box-shadow:var(--shadow);

transition:.3s;

border-left:5px solid var(--primary);

}

.kpi-card:hover{

transform:translateY(-6px);

}

.kpi-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:18px;

}

.kpi-icon{

width:58px;

height:58px;

border-radius:15px;

background:#E8F7F9;

display:flex;

align-items:center;

justify-content:center;

}

.kpi-icon i{

font-size:26px;

color:var(--primary);

}

.kpi-title{

font-size:14px;

font-weight:600;

color:var(--text-light);

}

.kpi-value{

font-size:38px;

font-weight:700;

margin-top:10px;

}

.kpi-footer{

margin-top:15px;

font-size:12px;

color:var(--success);

font-weight:600;

}


/*====================================================

QUICK ACTIONS

====================================================*/

.quick-actions{

margin-bottom:40px;

}

.action-grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

}

.action-card{

background:var(--white);

border-radius:18px;

padding:24px;

text-align:center;

text-decoration:none;

color:inherit;

box-shadow:var(--shadow);

transition:.3s;

cursor:pointer;

}

.action-card:hover{

transform:translateY(-6px);

background:#F9FCFD;

}

.action-card i{

font-size:34px;

color:var(--primary);

margin-bottom:15px;

}

.action-card h3{

font-size:18px;

margin-bottom:8px;

}

.action-card p{

font-size:13px;

line-height:22px;

color:var(--text-light);

}


/*====================================================

RESPONSIVE

====================================================*/

@media(max-width:1200px){

.kpi-grid{

grid-template-columns:repeat(2,1fr);

}

.action-grid{

grid-template-columns:repeat(2,1fr);

}

}

@media(max-width:700px){

.kpi-grid,

.action-grid{

grid-template-columns:1fr;

}

}
/*====================================================

MAIN MODULES

====================================================*/

.modules{

margin-bottom:40px;

}

.module-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

gap:25px;

}

.module-card{

background:var(--white);

border-radius:20px;

padding:28px;

box-shadow:var(--shadow);

text-decoration:none;

color:inherit;

transition:.30s ease;

position:relative;

overflow:hidden;

border:1px solid transparent;

}

.module-card:hover{

transform:translateY(-8px);

border-color:var(--primary);

}

.module-top{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:22px;

}

.module-icon{

width:65px;

height:65px;

border-radius:16px;

background:#EAF8FA;

display:flex;

align-items:center;

justify-content:center;

}

.module-icon i{

font-size:28px;

color:var(--primary);

}

.module-status{

padding:6px 14px;

border-radius:20px;

font-size:12px;

font-weight:600;

}

.status-live{

background:#EAF9F1;

color:var(--success);

}

.status-soon{

background:#FFF6E6;

color:var(--warning);

}

.module-card h3{

font-size:22px;

margin-bottom:12px;

}

.module-card p{

font-size:14px;

line-height:25px;

color:var(--text-light);

margin-bottom:18px;

}

.module-footer{

display:flex;

justify-content:space-between;

align-items:center;

font-size:13px;

color:var(--primary);

font-weight:600;

}

.module-footer i{

margin-left:6px;

}
/*====================================================

LIVE DASHBOARD PANELS

====================================================*/

.dashboard-panels{

display:grid;

grid-template-columns:1fr 1fr;

gap:25px;

margin-bottom:40px;

}

.panel{

background:var(--white);

border-radius:20px;

padding:28px;

box-shadow:var(--shadow);

}

.panel h2{

font-size:22px;

color:var(--primary);

margin-bottom:20px;

}

.activity-list{

display:flex;

flex-direction:column;

gap:16px;

}

.activity-item{

display:flex;

align-items:flex-start;

gap:15px;

padding:16px;

background:#F8FBFC;

border-radius:14px;

border-left:4px solid var(--primary);

}

.activity-item i{

font-size:18px;

color:var(--primary);

margin-top:3px;

}

.activity-item h4{

font-size:15px;

margin-bottom:4px;

}

.activity-item p{

font-size:13px;

line-height:22px;

color:var(--text-light);

}

.empty-state{

text-align:center;

padding:30px 20px;

color:var(--text-light);

}

.empty-state i{

font-size:40px;

margin-bottom:15px;

color:#B8C6CC;

}

.floating-return{

position:fixed;

right:30px;

bottom:30px;

width:65px;

height:65px;

border-radius:50%;

background:var(--primary);

display:flex;

align-items:center;

justify-content:center;

text-decoration:none;

color:white;

font-size:24px;

box-shadow:0 12px 25px rgba(0,0,0,.18);

transition:.30s;

z-index:999;

}

.floating-return:hover{

background:var(--primary-dark);

transform:translateY(-4px) scale(1.05);

}

@media(max-width:900px){

.dashboard-panels{

grid-template-columns:1fr;

}

}
<!-- ==============================================
LIVE OPERATIONS
============================================== -->

<section class="dashboard-panels">

<div class="panel">

<h2>

Pending Actions

</h2>

<div class="activity-list"

id="pendingActions">

<div class="empty-state">

<i class="fa-solid fa-clipboard-check"></i>

<h3>

No Pending Actions

</h3>

<p>

Deployment approvals, recall requests,
and manpower shortages will automatically
appear here.

</p>

</div>

</div>

</div>



<div class="panel">

<h2>

Recent Activity

</h2>

<div class="activity-list"

id="recentActivity">

<div class="empty-state">

<i class="fa-solid fa-clock-rotate-left"></i>

<h3>

No Recent Activity

</h3>

<p>

Employee deployment,
recall history,
and profile updates will appear here.

</p>

</div>

</div>

</div>

</section>



<a href="index.html"

class="floating-return"

title="Return to Login">

<i class="fa-solid fa-right-from-bracket"></i>

</a>



<script>

/*==========================================

LOGIN SESSION

==========================================*/

const currentUser = JSON.parse(localStorage.getItem("loggedUser"));

if(!currentUser){

window.location.href="index.html";

}



/*==========================================

PROFILE

==========================================*/

document.getElementById("userName").textContent=currentUser.name;

document.getElementById("employeeId").textContent="Employee ID : "+currentUser.employeeId;

document.getElementById("userRole").textContent=currentUser.role;



/*==========================================

GREETING

==========================================*/

const hour=new Date().getHours();

let greeting="Good Evening";

if(hour<12){

greeting="Good Morning";

}

else if(hour<17){

greeting="Good Afternoon";

}

document.getElementById("welcomeGreeting").innerHTML=

greeting+", "+currentUser.name;



/*==========================================

LIVE DATE & TIME

==========================================*/

function updateClock(){

const now=new Date();

document.getElementById("currentDate").textContent=

now.toLocaleDateString();

document.getElementById("currentTime").textContent=

now.toLocaleTimeString();

}

updateClock();

setInterval(updateClock,1000);



/*==========================================

LOAD DASHBOARD KPI

==========================================*/

const dashboard=

JSON.parse(localStorage.getItem("dashboardKPIs"));

if(dashboard){

document.getElementById("totalEmployees").textContent=

dashboard.totalEmployees;

document.getElementById("readyEmployees").textContent=

dashboard.readyEmployees;

document.getElementById("deployedEmployees").textContent=

dashboard.deployedEmployees;

document.getElementById("openTasks").textContent=

dashboard.openTasks;

}



/*==========================================

ROLE BASED ACCESS

==========================================*/

if(currentUser.role==="Team Lead"){

document.getElementById("reportsModule").style.display="none";

}

if(currentUser.role==="Admin"){

// Future Admin Controls

}



/*==========================================

LOGOUT

==========================================*/

document.getElementById("logoutBtn")

.addEventListener("click",function(){

localStorage.clear();

});

</script>

</body>

</html>
