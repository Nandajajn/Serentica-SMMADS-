/*====================================

DEPARTMENT PANEL

.department-panel{

background:#FFFFFF;

border-radius:18px;

padding:20px;

box-shadow:var(--shadow);

overflow-y:auto;

}

.department-panel h3{

font-size:22px;

margin-bottom:8px;

color:var(--primary);

}

.panel-subtitle{

color:#666;

margin-bottom:20px;

}

.department-list{

display:flex;

flex-direction:column;

gap:12px;

}

.department-card{

display:flex;

justify-content:space-between;

align-items:center;

}

====================================*/

flex-direction:column;

<script>

/*====================================================

LOGGED IN USER

====================================================*/

const loggedUser =
JSON.parse(localStorage.getItem("loggedUser"));

if(!loggedUser){

window.location.href="index.html";

}

/*====================================================

DISPLAY USER DETAILS

====================================================*/

document.querySelector(".header h1").innerHTML =
"Employee Management";

document.querySelector(".header p").innerHTML =
"Manage workforce, deployment readiness and employee records";

document.querySelector(".header-right h4").innerHTML =
loggedUser.name;

document.querySelector(".header-right p").innerHTML =
loggedUser.role;


/*====================================================

SAMPLE EMPLOYEE DATABASE

(To be replaced later with employees.json
or database)

====================================================*/

const employees=[

{
id:"EMP001",
name:"Employee 1",
designation:"Site Engineer",
department:"Civil",
manager:"Civil Manager",
task:"Foundation Inspection",
efficiency:92,
deployment:"Available",
ready:"Yes",
remarks:"Ready for deployment",
photo:"assets/profile.png"
},

{
id:"EMP002",
name:"Employee 2",
designation:"Mechanical Engineer",
department:"Mechanical",
manager:"Mechanical Manager",
task:"WTG Erection",
efficiency:88,
deployment:"Available",
ready:"No",
remarks:"Assigned to critical activity",
photo:"assets/profile.png"
},

{
id:"EMP003",
name:"Employee 3",
designation:"Electrical Engineer",
department:"Electrical",
manager:"Electrical Manager",
task:"33kV Cable Testing",
efficiency:95,
deployment:"Deployed",
ready:"No",
remarks:"Currently deployed",
photo:"assets/profile.png"
}

];


/*====================================================

LOAD EMPLOYEE TABLE

====================================================*/

function loadEmployees(employeeList){

const table =
document.getElementById("employeeTableBody");

table.innerHTML="";

employeeList.forEach(emp=>{

table.innerHTML += `

<tr>

<td>

<img src="${emp.photo}"

class="table-photo">

</td>

<td>${emp.id}</td>

<td>${emp.name}</td>

<td>${emp.designation}</td>

<td>${emp.department}</td>

<td>${emp.task}</td>

<td>

<div class="progress-bar">

<div class="progress-fill"

style="width:${emp.efficiency}%">

</div>

</div>

${emp.efficiency}%

</td>

<td>

<span class="status
${emp.deployment==="Available"?"available":"deployed"}">

${emp.deployment}

</span>

</td>

<td>

<span class="ready-badge">

${emp.ready}

</span>

</td>

<td>

<button
class="view-btn"
onclick="viewEmployee('${emp.id}')">

View

</button>

</td>

</tr>

`;

});

}

loadEmployees(employees);


/*====================================================

VIEW EMPLOYEE

====================================================*/

function viewEmployee(id){

const emp =
employees.find(e=>e.id===id);

document.getElementById("profilePhoto").src =
emp.photo;

document.getElementById("profileName").innerHTML =
emp.name;

document.getElementById("profileDesignation").innerHTML =
emp.designation;

document.getElementById("empID").innerHTML =
emp.id;

document.getElementById("empDepartment").innerHTML =
emp.department;

document.getElementById("empManager").innerHTML =
emp.manager;

document.getElementById("empTask").innerHTML =
emp.task;

document.getElementById("empEfficiency").innerHTML =
emp.efficiency+"%";

document.getElementById("empDeployment").innerHTML =
emp.deployment;

document.getElementById("empReady").innerHTML =
emp.ready;

document.getElementById("empRemarks").innerHTML =
emp.remarks;

}
/*====================================================

DEPARTMENT FILTER

====================================================*/

const departmentCards =
document.querySelectorAll(".department-card");

departmentCards.forEach(card=>{

card.addEventListener("click",function(){

departmentCards.forEach(c=>c.classList.remove("active"));

this.classList.add("active");

const department =
this.dataset.department;

if(department==="All"){

loadEmployees(employees);

}

else{

const filteredEmployees =

employees.filter(emp=>

emp.department===department

);

loadEmployees(filteredEmployees);

}

});

});


/*====================================================

SEARCH EMPLOYEE

====================================================*/

document

.getElementById("searchEmployee")

.addEventListener("keyup",function(){

const keyword =
this.value.toLowerCase();

const filteredEmployees =

employees.filter(emp=>

emp.name.toLowerCase().includes(keyword) ||

emp.id.toLowerCase().includes(keyword) ||

emp.designation.toLowerCase().includes(keyword)

);

loadEmployees(filteredEmployees);

});


/*====================================================

STATUS FILTER

====================================================*/

document

.getElementById("statusFilter")

.addEventListener("change",function(){

const status=this.value;

if(status==="All"){

loadEmployees(employees);

return;

}

const filteredEmployees=

employees.filter(emp=>{

if(status==="Available")

return emp.deployment==="Available";

if(status==="Ready")

return emp.ready==="Yes";

if(status==="Deployed")

return emp.deployment==="Deployed";

});

loadEmployees(filteredEmployees);

});


/*====================================================

DEPARTMENT COUNTS

====================================================*/

function updateDepartmentCounts(){

document.getElementById("countAll").innerHTML=
employees.length;

const departments=[

"PMO",

"Civil",

"Mechanical",

"Electrical",

"QHSE",

"Stores",

"Land Acquisition",

"ROW",

"Administration",

"OEM"

];

departments.forEach(dept=>{

const total=

employees.filter(emp=>

emp.department===dept

).length;

const idMap={

"PMO":"countPMO",

"Civil":"countCivil",

"Mechanical":"countMechanical",

"Electrical":"countElectrical",

"QHSE":"countQHSE",

"Stores":"countStores",

"Land Acquisition":"countLand",

"ROW":"countROW",

"Administration":"countAdmin",

"OEM":"countOEM"

};

document.getElementById(idMap[dept]).innerHTML=total;

});

}

updateDepartmentCounts();


/*====================================================

UPDATE DASHBOARD KPIs

====================================================*/

function updateDashboardKPIs(){

const totalEmployees=employees.length;

const readyEmployees=

employees.filter(emp=>emp.ready==="Yes").length;

const deployedEmployees=

employees.filter(emp=>emp.deployment==="Deployed").length;

const openTasks=

employees.filter(emp=>

emp.deployment==="Available"

).length;

localStorage.setItem(

"dashboardKPIs",

JSON.stringify({

totalEmployees,

readyEmployees,

deployedEmployees,

openTasks

})

);

}

updateDashboardKPIs();


/*====================================================

ROLE PERMISSIONS

====================================================*/

if(loggedUser.role==="Admin"){

document.getElementById("editEmployee").style.display="none";

document.getElementById("recommendDeployment").style.display="none";

}

if(loggedUser.role==="Project Manager"){

document.getElementById("recommendDeployment").innerHTML=

"Approve Deployment";

}

if(loggedUser.role==="Team Lead"){

document.getElementById("recommendDeployment").innerHTML=

"Recommend Deployment";

}


/*====================================================

LOGOUT

====================================================*/

document

.getElementById("logoutBtn")

.addEventListener("click",function(){

localStorage.removeItem("loggedUser");

});


/*====================================================

CURRENT DATE & TIME

====================================================*/

function updateDateTime(){

const now=new Date();

document.querySelector(".header-right h4").innerHTML=

loggedUser.name;

document.querySelector(".header-right p").innerHTML=

loggedUser.role+" | "+now.toLocaleString("en-IN");

}

updateDateTime();

setInterval(updateDateTime,1000);


/*====================================================

SYSTEM READY

====================================================*/

console.clear();

console.log("======================================");
console.log("Employee Management Module Loaded");
console.log("Serentica Site Manpower Management");
console.log("Version 1.0");
console.log("======================================");

</script>

</body>

</html>
