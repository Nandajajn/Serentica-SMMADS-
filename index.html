<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Serentica Site Manpower Management System
</title>

<!-- Google Font -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<!-- Font Awesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{

--primary:#33A7B5;
--primary-dark:#1F7E8A;
--background:#F4F8FA;
--white:#FFFFFF;
--text:#2D3748;
--border:#DDE5EA;
--shadow:0 15px 40px rgba(0,0,0,0.08);

}

body{

background:linear-gradient(135deg,#F8FBFC,#EEF6F8);

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

overflow:hidden;

position:relative;

}

/* Decorative Background */

body::before{

content:"";

position:absolute;

width:500px;

height:500px;

background:rgba(51,167,181,0.06);

border-radius:50%;

top:-220px;

left:-180px;

}

body::after{

content:"";

position:absolute;

width:420px;

height:420px;

background:rgba(51,167,181,0.05);

border-radius:50%;

bottom:-180px;

right:-150px;

}

/* Login Card */

.login-card{

position:relative;

z-index:10;

background:var(--white);

width:460px;

padding:45px;

border-radius:24px;

box-shadow:var(--shadow);

text-align:center;

}

/* Logo */

.logo{

width:120px;

margin-bottom:20px;

}

h1{

font-size:28px;

color:var(--primary);

margin-bottom:10px;

}

.subtitle{

font-size:15px;

color:#666;

line-height:26px;

margin-bottom:35px;

}

/* Form */

.form-group{

text-align:left;

margin-bottom:22px;

}

.form-group label{

display:block;

margin-bottom:8px;

font-size:14px;

font-weight:600;

color:#444;

}

.input-box{

position:relative;

}

.input-box i{

position:absolute;

left:16px;

top:50%;

transform:translateY(-50%);

color:#999;

}

.input-box input{

width:100%;

padding:14px 16px 14px 48px;

border:1px solid var(--border);

border-radius:12px;

font-size:15px;

outline:none;

transition:.3s;

}

.input-box input:focus{

border-color:var(--primary);

box-shadow:0 0 0 3px rgba(51,167,181,0.12);

}

/* Forgot Password */

.forgot{

text-align:right;

margin-bottom:28px;

}

.forgot a{

text-decoration:none;

font-size:14px;

color:var(--primary);

font-weight:500;

}

.forgot a:hover{

text-decoration:underline;

}
/*====================================

LOGIN BUTTON

====================================*/

.login-btn{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:var(--primary);

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:0.3s;

letter-spacing:0.5px;

}

.login-btn:hover{

background:var(--primary-dark);

transform:translateY(-2px);

box-shadow:0 8px 18px rgba(51,167,181,0.25);

}

/*====================================

FOOTER

====================================*/

.footer{

margin-top:35px;

font-size:13px;

color:#888;

line-height:22px;

}

.footer span{

display:block;

margin-top:4px;

font-weight:500;

}

/*====================================

RESPONSIVE DESIGN

====================================*/

@media(max-width:600px){

.login-card{

width:92%;

padding:30px;

}

h1{

font-size:23px;

}

.subtitle{

font-size:14px;

}

}

</style>

</head>

<body>

<div class="login-card">

<img
src="assets/images/logo.png"
alt="Serentica Logo"
class="logo">

<h1>

Serentica Site Manpower Management System

</h1>

<p class="subtitle">

Workforce Deployment & Operations Portal

</p>

<form
id="loginForm">

<div class="form-group">

<label>

Login ID

</label>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input

type="text"

id="username"

placeholder="Enter Login ID"

required>

</div>

</div>

<div class="form-group">

<label>

Password

</label>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input

type="password"

id="password"

placeholder="Enter Password"

required>

</div>

</div>

<div class="forgot">

<a
href="#"
id="forgotPassword">

Forgot Password?

</a>

</div>

<button

type="submit"

class="login-btn">

<i class="fa-solid fa-right-to-bracket"></i>

&nbsp;

Login

</button>

</form>

<div class="footer">

© 2026 Serentica Renewables Private Limited

<span>

Version 1.0

</span>

</div>

</div>
<script>

/*====================================================

USER DATABASE

(To be replaced later with users.json/database)

====================================================*/

const users = [

{

username:"admin",

password:"admin123",

name:"System Administrator",

role:"Admin"

},

{

username:"pm",

password:"pm123",

name:"Project Manager",

role:"Project Manager"

},

{

username:"lead",

password:"lead123",

name:"Team Lead",

role:"Team Lead"

}

];


/*====================================================

LOGIN AUTHENTICATION

====================================================*/

document

.getElementById("loginForm")

.addEventListener("submit",function(e){

e.preventDefault();

const username =

document.getElementById("username")

.value.trim();

const password =

document.getElementById("password")

.value;

const user = users.find(u =>

u.username === username &&

u.password === password

);

if(user){

localStorage.setItem(

"loggedUser",

JSON.stringify(user)

);

window.location.href="welcome.html";

}

else{

alert(

"Invalid Login ID or Password."

);

document.getElementById("password").value="";

document.getElementById("password").focus();

}

});


/*====================================================

FORGOT PASSWORD

====================================================*/

document

.getElementById("forgotPassword")

.addEventListener("click",function(e){

e.preventDefault();

alert(

"Please contact the Site HR Administrator or Corporate HR Team to reset your password."

);

});


/*====================================================

ENTER KEY SUPPORT

====================================================*/

document

.addEventListener("keypress",function(e){

if(e.key==="Enter"){

document

.getElementById("loginForm")

.requestSubmit();

}

});


/*====================================================

CLEAR FORM ON PAGE LOAD

====================================================*/

window.onload=function(){

document.getElementById("username").value="";

document.getElementById("password").value="";

document.getElementById("username").focus();

};
/*====================================================

SESSION MANAGEMENT

====================================================*/

// Prevent access to login page using browser back
// button after successful login.

window.addEventListener("pageshow",function(event){

if(localStorage.getItem("loggedUser")){

history.pushState(null,null,location.href);

window.onpopstate=function(){

history.go(1);

};

}

});


/*====================================================

LOGOUT COMPATIBILITY

====================================================*/

// When user logs out from welcome.html,
// the "loggedUser" session will be removed.
// Therefore reopening index.html will always
// display a fresh login screen.

if(!localStorage.getItem("loggedUser")){

document.getElementById("username").focus();

}


/*====================================================

INITIAL PAGE ANIMATION

====================================================*/

window.addEventListener("load",()=>{

const loginCard=document.querySelector(".login-card");

loginCard.style.opacity="0";

loginCard.style.transform="translateY(25px)";

setTimeout(()=>{

loginCard.style.transition="all .6s ease";

loginCard.style.opacity="1";

loginCard.style.transform="translateY(0px)";

},100);

});


/*====================================================

SYSTEM INFORMATION

====================================================*/

console.clear();

console.log("========================================");
console.log("Serentica Site Manpower Management");
console.log("Login Module Initialised Successfully");
console.log("Version 2.0");
console.log("========================================");

</script>

</body>

</html>
